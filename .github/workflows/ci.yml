name: Quality
on: [push, pull_request]
permissions:
 contents: read
jobs:
 check:
  runs-on: ubuntu-latest
  services:
   postgres:
    image: postgres:17-alpine
    env:
     POSTGRES_USER: flowsaldo
     POSTGRES_PASSWORD: flowsaldo_local
     POSTGRES_DB: flowsaldo
    ports: ['5432:5432']
    options: --health-cmd "pg_isready -U flowsaldo" --health-interval 5s --health-timeout 5s --health-retries 10
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 24
      cache: npm
   - run: npm ci
   - run: cp .env.example .env
   - run: npm run db:generate
   - run: npx prisma migrate deploy --config packages/database/prisma.config.ts
     working-directory: .
     env:
      DATABASE_URL: postgresql://flowsaldo:flowsaldo_local@localhost:5432/flowsaldo
   - run: npm run check
   - run: npm run db:seed
   - run: node scripts/smoke.mjs
   - run: npx playwright install --with-deps chromium
   - run: npm run test:web

 dev-web:
  timeout-minutes: 10
  strategy:
   fail-fast: false
   matrix:
    os: [ubuntu-latest, windows-latest]
  runs-on: ${{ matrix.os }}
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 24
      cache: npm
   - run: npm ci
   - run: npx playwright install chromium
   - run: npm run test:dev
