name: Quality
on: [push, pull_request]
permissions:
 contents: read
jobs:
 check:
  runs-on: ubuntu-latest
  services:
   postgres:
    image: postgres:17-alpine
    env:
     POSTGRES_USER: flowsaldo
     POSTGRES_PASSWORD: flowsaldo_local
     POSTGRES_DB: flowsaldo
    ports: ['5432:5432']
    options: --health-cmd "pg_isready -U flowsaldo" --health-interval 5s --health-timeout 5s --health-retries 10
  steps:
   - uses: actions/checkout@v4
   - uses: pnpm/action-setup@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 24
      cache: pnpm
   - run: pnpm install --frozen-lockfile
   - run: cp .env.example .env
   - run: pnpm db:generate
   - run: pnpm exec prisma migrate deploy --config packages/database/prisma.config.ts
     working-directory: .
     env:
      DATABASE_URL: postgresql://flowsaldo:flowsaldo_local@localhost:5432/flowsaldo
   - run: pnpm check
   - run: pnpm db:seed
   - run: node scripts/smoke.mjs
   - run: pnpm exec playwright install --with-deps chromium
   - run: pnpm test:web

 dev-web:
  timeout-minutes: 10
  strategy:
   fail-fast: false
   matrix:
    os: [ubuntu-latest, windows-latest]
  runs-on: ${{ matrix.os }}
  steps:
   - uses: actions/checkout@v4
   - uses: pnpm/action-setup@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 24
      cache: pnpm
   - run: pnpm install --frozen-lockfile
   - run: pnpm exec playwright install chromium
   - run: pnpm test:dev

 ai-contracts:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: pnpm/action-setup@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 24
   - run: pnpm ai:validate
   - run: pnpm ai:test
   - run: node scripts/ai.mjs plan --task "Validar mejora sintética" --scope fullstack
   - run: node scripts/ai.mjs packet --task "Validar mejora sintética" --scope frontend --agent frontend
