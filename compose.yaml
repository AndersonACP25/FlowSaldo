services:
 postgres:
  image: postgres:17-alpine
  environment:
   POSTGRES_USER: flowsaldo
   POSTGRES_PASSWORD: flowsaldo_local
   POSTGRES_DB: flowsaldo
  ports:
   - "127.0.0.1:5432:5432"
  volumes:
   - flowsaldo_data:/var/lib/postgresql/data
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U flowsaldo -d flowsaldo"]
   interval: 5s
   timeout: 5s
   retries: 10
volumes:
 flowsaldo_data:
